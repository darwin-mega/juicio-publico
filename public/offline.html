<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0f14" />
    <title>Juicio Público — Sin conexión</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #0d0f14; color: #f5f7fb; }
      main { width: min(100%, 420px); padding: 28px; border: 1px solid #343949; border-radius: 16px; background: #171a22; text-align: center; }
      img { width: 84px; height: 84px; border-radius: 18px; }
      h1 { margin: 18px 0 8px; font-size: 1.55rem; }
      p { margin: 0; color: #c4cada; line-height: 1.55; }
      button { width: 100%; margin-top: 22px; min-height: 48px; border: 0; border-radius: 10px; background: #f5f7fb; color: #0d0f14; font-weight: 800; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/img/Juicio-logo.png" alt="" />
      <h1>Estás sin conexión</h1>
      <p>El modo multidispositivo necesita Internet. Si ya abriste antes el Modo Mesa, podés volver e intentar continuar la partida guardada.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
